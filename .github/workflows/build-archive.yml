name: Build archive
permissions:
  contents: write
on:
  workflow_dispatch:
  push: 
    #branches: [main]
    tags:
      - "releases/*"
  pull_request:
    branches: [main]

env:
  artifact_name: "basic-tests-plugin"

jobs:
  build-archive:
    name: Build archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - run: mkdir -p build && rm -f build/${{ env.artifact_name }}.zip && zip -r "build/${{ env.artifact_name }}.zip" manifest.json mcp-echo-tools.json color.png outline.png skills/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.artifact_name }}
          path: |
            build/${{ env.artifact_name }}.zip

  create-github-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build-archive
    if: startsWith(github.ref, 'refs/tags/releases/')
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ env.artifact_name }}

      # example input (github.ref_name):  "releases/v2.0"
      # example output (release_version): "v2.0"
      - name: Extract version number from git tag name
        id: splittag
        env:
          git_tag: ${{ github.ref_name }}
        run: echo "release_version=`echo ${git_tag:9}`" >> $GITHUB_OUTPUT
      
      - run: echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      - run: |
          echo "${{ steps.splittag.outputs.release_version }}" 
          ls -alh .

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: '${{ github.event.repository.name }}-${{ steps.splittag.outputs.release_version }}'
          files: |
            ${{ env.artifact_name }}.zip
          draft: true
          prerelease: true