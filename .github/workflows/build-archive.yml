name: Build archive
permissions:
  contents: write
on:
  workflow_dispatch:
  push: 
    #branches: [main]
    tags:
      - "releases/*"
  pull_request:
    branches: [main]

env:
  artifact_name: "cowork-basic-plugin-mcp"

jobs:
  build-archive:
    name: Build archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: zip -r "build/${{ env.artifact_name }}.zip" manifest.json mcp-echo-tools.json color.png outline.png skills/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifact_name }}
          path: |
            build/${{ env.artifact_name }}.zip

  create-github-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build-archive
    if: startsWith(github.ref, 'refs/tags/releases/')
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.artifact_name }}

      # example input (github.ref_name):  "releases/v2.0"
      # example output (release_version): "v2.0"
      - name: Extract version number from git tag name
        id: splittag
        env:
          git_tag: ${{ github.ref_name }}
        run: echo "release_version=`echo ${git_tag:9}`" >> $GITHUB_OUTPUT
      
      - run: echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      - run: |
          echo "${{ steps.splittag.outputs.release_version }}" 
          ls -alh .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: '${{ github.event.repository.name }}-${{ steps.splittag.outputs.release_version }}'
          files: |
            ${{ env.artifact_name }}.zip
          draft: true
          prerelease: true